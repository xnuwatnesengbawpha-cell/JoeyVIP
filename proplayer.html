<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<!-- 📱 สำคัญมาก -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Joey Stream</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    overflow:hidden;
}

/* 🔥 พื้นหลัง */
.bg{
    position:fixed;
    width:100%;
    height:100%;
    background:url('https://i.pinimg.com/736x/3d/58/2d/3d582d63a0feaa0551ed441fd516e5e6.jpg') center/cover no-repeat;
    filter: blur(8px) brightness(0.5);
    z-index:-1;
}

/* กล่องกลาง */
.container{
    text-align:center;
    padding:20px;
}

/* 🌈 หัวข้อ */
h1{
    font-size:60px;
    margin-bottom:10px;

    background: linear-gradient(270deg, red, orange, yellow, green, cyan, blue, violet);
    background-size:400%;

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    animation: rainbow 5s linear infinite;
}

/* ข้อความรอง */
.sub{
    margin-bottom:40px;
    opacity:0.8;
}

/* ปุ่มรวม */
.buttons{
    display:flex;
    gap:40px;
    justify-content:center;
    flex-wrap:wrap; /* 🔥 ทำให้ไม่ล้น */
}

/* แต่ละ item */
.item{
    text-align:center;
    text-decoration:none;
    color:white;
}

/* ปุ่ม */
.btn{
    width:250px;
    height:120px;
    border-radius:15px;
    overflow:hidden;
    cursor:pointer;
    position:relative;

    background: linear-gradient(270deg, red, orange, yellow, green, cyan, blue, violet);
    background-size:1400% 1400%;

    animation: rainbow 6s ease infinite, pulse 1.5s infinite;

    box-shadow:
    0 0 10px red,
    0 0 20px orange,
    0 0 40px yellow,
    0 0 80px purple;
}

/* ขอบไฟ */
.btn::before{
    content:"";
    position:absolute;
    top:-2px;
    left:-2px;
    right:-2px;
    bottom:-2px;
    border-radius:15px;

    background: linear-gradient(270deg, red, orange, yellow, green, cyan, blue, violet);
    background-size:1400% 1400%;
    z-index:-1;

    animation: rainbow 6s linear infinite;
}

/* รูป */
.btn img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ข้อความใต้ปุ่ม */
.label{
    margin-top:10px;
    font-size:18px;

    background: linear-gradient(90deg, red, orange, yellow, green, blue, violet);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    text-shadow:0 0 10px rgba(255,255,255,0.5);
    transition:0.3s;
}

/* hover */
.item:hover .btn{
    transform:scale(1.15);
    filter:brightness(1.3);
}

.item:hover .label{
    transform:scale(1.1);
}

/* animation */
@keyframes rainbow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

/* 📱 มือถือ */
@media (max-width: 600px){

    h1{
        font-size:40px;
    }

    .btn{
        width:140px;
        height:80px;
    }

    .label{
        font-size:14px;
    }

    .buttons{
        gap:20px;
    }
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="container">
    <h1>สวัสดี</h1>
    <div class="sub">— ยินดีต้อนรับงับบ —</div>

    <div class="buttons">

        <!-- Server -->
        <a href="https://www.roblox.com/share?code=7782f8b893833a499161a289c45f9b0e&type=Server" target="_blank" class="item">
            <div class="btn">
                <img src="https://i.pinimg.com/1200x/06/71/7e/06717ec114fcb2b7c87de350c743d801.jpg">
            </div>
            <div class="label">🎮 ลิงก์เซิฟ</div>
        </a>

        <!-- Instagram -->
        <a href="https://www.instagram.com/rtx_y31?stkn=MThsMGpramkzbG11cw==" target="_blank" class="item">
            <div class="btn">
                <img src="https://i.pinimg.com/1200x/ef/0e/81/ef0e8197c22b8d1563acacd2e0ef1b6a.jpg">
            </div>
            <div class="label">📸 อินสตาแกรม</div>
        </a>

        <!-- Profile -->
        <a href="https://www.roblox.com/share?code=0133c2754aac614db471235089a22d84&type=Profile&source=ProfileShare&stamp=1790569636361" target="_blank" class="item">
            <div class="btn">
                <img src="https://i.pinimg.com/736x/a0/23/c3/a023c32aed5e33c255e6b013a976b912.jpg">
            </div>
            <div class="label">👤 โปรไฟล์</div>
        </a>

    </div>
</div>

</body>
</html>
